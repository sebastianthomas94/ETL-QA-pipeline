name: "Lint & Format"

on:
    workflow_call:
        inputs:
            node_version:
                required: true
                type: string

jobs:
    lint-and-format:
        name: Lint & Format
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10.12.4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ inputs.node_version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # 1. LINT
            - name: Run lint
              id: lint
              run: pnpm lint

            - name: Comment on lint failures
              if: steps.lint.outcome == 'failure'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        body: '🚫 **Lint failed** – please fix lint errors before merging.'
                      })

            - name: Exit on lint failure
              if: steps.lint.outcome == 'failure'
              run: exit 1

            # 2. FORMAT
            - name: Run formatter
              id: format
              run: pnpm format

            - name: Detect formatting changes
              id: changes
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit formatting changes
              if: steps.changes.outputs.changes == 'true'
              run: |
                  git add .
                  git commit -m "chore: apply formatting changes"
                  git push

            - name: Comment on formatting commit
              if: steps.changes.outputs.changes == 'true'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        body: '⚙️ Formatting applied and committed. No further action required.'
                      })
